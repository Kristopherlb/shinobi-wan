# Blueprint BP-I12: ElastiCache Redis
#
# Architecture:
#   VPC + Subnet + Security Group
#   ElastiCache Redis ReplicationGroup (encrypted, AUTH enabled)
#   Lambda consumer with VPC access
#
# Features:
#   - Redis replication group with 2 cache clusters
#   - In-transit and at-rest encryption
#   - AUTH token for access control
#   - VPC-isolated with subnet group

service: elasticache-redis

components:
  # VPC for network isolation
  - id: app-vpc
    type: platform
    platform: aws-vpc
    config:
      cidrBlock: '10.0.0.0/16'

  # Subnet for ElastiCache
  - id: cache-subnet
    type: platform
    platform: aws-subnet
    config:
      vpcId: 'platform:app-vpc'
      cidrBlock: '10.0.10.0/24'
      availabilityZone: us-east-1a

  # Security group for Redis access
  - id: cache-sg
    type: platform
    platform: aws-security-group
    config:
      vpcId: 'platform:app-vpc'
      description: 'ElastiCache Redis security group'

  # ElastiCache Redis replication group
  - id: redis
    type: platform
    platform: aws-elasticache
    config:
      nodeType: cache.t3.micro
      numCacheClusters: 2
      transitEncryptionEnabled: true
      atRestEncryptionEnabled: true
      authToken: '${ssm:/app/redis-auth-token}'
      port: 6379
      subnetIds:
        - 'platform:cache-subnet'
      securityGroupIds:
        - 'platform:cache-sg'

  # Lambda consumer that reads from Redis
  - id: cache-reader
    type: component
    platform: aws-lambda
    config:
      runtime: nodejs20.x
      handler: index.handler
      memorySize: 256
      timeout: 30
      tracing: true

bindings:
  # Lambda reads from Redis cache
  - source: cache-reader
    target: redis
    type: bindsTo
    config:
      resourceType: redis
      accessLevel: read
      network:
        port: 6379
        protocol: tcp
      configKeys:
        - key: REDIS_ENDPOINT
          valueSource:
            type: reference
            nodeRef: redis
            field: primaryEndpointAddress

policyPack: Baseline
