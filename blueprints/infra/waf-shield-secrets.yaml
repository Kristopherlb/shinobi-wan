# Blueprint BP-I15: WAF + Shield + Secrets Management
#
# Architecture:
#   KMS Key → SecretsManager Secret (encrypted, rotating)
#   WAF Web ACL → CloudFront Distribution → S3 Origin
#   ACM Certificate for HTTPS
#
# Features:
#   - KMS encryption key with automatic rotation
#   - SecretsManager secret with rotation schedule
#   - WAF protection for CloudFront
#   - ACM certificate with DNS validation
#   - S3 origin with CloudFront distribution

service: waf-shield-secrets

components:
  # KMS encryption key for secrets
  - id: encryption-key
    type: platform
    platform: aws-kms
    config:
      keySpec: SYMMETRIC_DEFAULT
      enableKeyRotation: true
      deletionWindowInDays: 30

  # SecretsManager secret encrypted with KMS key
  - id: app-secret
    type: platform
    platform: aws-secretsmanager
    config:
      kmsKeyId: 'platform:encryption-key'
      rotationEnabled: true
      rotationDays: 30

  # WAF Web ACL for CloudFront protection
  - id: web-acl
    type: platform
    platform: aws-wafv2
    config:
      scope: CLOUDFRONT
      defaultAction: allow
      managedRules:
        - name: AWSManagedRulesCommonRuleSet
          priority: 1
        - name: AWSManagedRulesKnownBadInputsRuleSet
          priority: 2

  # ACM certificate for HTTPS
  - id: ssl-cert
    type: platform
    platform: aws-acm
    config:
      domainName: 'waf-shield-secrets.example.com'
      validationMethod: DNS

  # CloudFront distribution with WAF
  - id: cdn
    type: platform
    platform: aws-cloudfront
    config:
      wafAclArn: 'platform:web-acl'
      certificateArn: 'platform:ssl-cert'
      minimumProtocolVersion: TLSv1.2_2021

  # S3 origin bucket
  - id: origin-bucket
    type: platform
    platform: aws-s3
    config:
      versioning: true

bindings:
  # CloudFront serves from S3 origin
  - source: cdn
    target: origin-bucket
    type: bindsTo
    config:
      resourceType: bucket
      accessLevel: read

  # SecretsManager uses KMS key for encryption
  - source: app-secret
    target: encryption-key
    type: bindsTo
    config:
      resourceType: key
      accessLevel: write

policyPack: Baseline
